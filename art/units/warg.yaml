# MVP2 stage 3; provisional design direction.
name: Warg
size: general
evolvesFrom: wolf
description: >-
  An evolved Wolf: massive natural quadrupedal grey-black warg retaining the long narrow muzzle,
  triangular ears, level back, low LEFTward bushy tail and long digitigrade legs of Wolf. A raised
  charcoal neck ruff, heavier jaw and pronounced shoulder ridge distinguish it without making a
  bear or werewolf. Restrained leather harness leaves all four legs exposed. Face RIGHT in every
  frame. Natural body, hair, feathers, stone and metal use the stated non-green palette; saturated
  green is reserved exclusively for team cloth. Team cloth: a broad upper-back cloth panel in
  readable pure flat green #00FF00; keep a broad unobstructed panel visible.
animationNotes: >-
  Idle: low breathing and ear twitch. Walk: follow the body-specific walkNotes. Attack: lower
  shoulders and load hindlegs; extend muzzle RIGHT in a short biting lunge; close jaws as forepaws
  land; recover low alert stance. Hit: brace all four paws and recoil at shoulders. Death: legs
  buckle, chest lowers and body rolls onto its side; final frame remains still. All five
  animations: idle, walk, attack, hit, death. Use four distinct sequential attack poses:
  anticipation, extension, follow-through, recovery. Keep full body, weapons, wings, tail, cloth
  and effects inside each cell with generous uninterrupted magenta gutters on all four sides,
  including death; shrink pose reach if needed. Fixed scale and anchor, no camera movement or
  neighbouring-cell overlap.
walkNotes: >-
  Low powerful quadrupedal trot with near foreleg/far hindleg reaching, tucked passing, opposite
  diagonal reaching, tucked passing. Near legs silver-grey, far legs charcoal; head stays level
  and paws skim ground. Four-frame full sheets use contact/passing/opposite contact/passing or the
  four flight phases above; six-frame movement strips add intermediate weight-transfer or
  wing-transition poses. Every adjacent frame advances the cycle. Stay in place facing RIGHT; near
  limbs lighter and far limbs darker, without swapping identities. Preserve grip and limb count;
  leave magenta clearance around the entire moving silhouette.
