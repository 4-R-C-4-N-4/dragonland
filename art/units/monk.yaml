# MVP2 stage 1; provisional design direction.
name: Monk
size: stage1
description: >-
  A sturdy brown-skinned monk with shaved head, cream wrap tunic, white trousers, gold wrist wraps
  and bare feet. A round bead necklace frames the neck, broad forearms held in an empty-handed
  guard. Face RIGHT in every frame. Natural body, hair, feathers, stone and metal use the stated
  non-green palette; saturated green is reserved exclusively for team cloth. Team cloth: a broad
  waist sash in readable pure flat green #00FF00; keep a broad unobstructed panel visible.
animationNotes: >-
  Idle: calm breathing with a small palm adjustment. Walk: follow the body-specific walkNotes.
  Attack: sink into a bent-knee guard with right fist drawn to ribs; extend near right fist
  horizontally RIGHT; bend elbow to withdraw; reset both palms at chest. Hit: forearms close and
  torso bends back. Death: knees fold and body settles on its side; final frame remains still. All
  five animations: idle, walk, attack, hit, death. Use four distinct sequential attack poses:
  anticipation, extension, follow-through, recovery. Keep full body, weapons, wings, tail, cloth
  and effects inside each cell with generous uninterrupted magenta gutters on all four sides,
  including death; shrink pose reach if needed. Fixed scale and anchor, no camera movement or
  neighbouring-cell overlap.
walkNotes: >-
  Grounded martial sliding steps with knees flexed: near foot slides forward, far foot draws in,
  far foot leads, near foot draws in. Feet stay low, hands remain in guard. Four-frame full sheets
  use contact/passing/opposite contact/passing or the four flight phases above; six-frame movement
  strips add intermediate weight-transfer or wing-transition poses. Every adjacent frame advances
  the cycle. Stay in place facing RIGHT; near limbs lighter and far limbs darker, without swapping
  identities. Preserve grip and limb count; leave magenta clearance around the entire moving
  silhouette.
