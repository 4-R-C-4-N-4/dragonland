# MVP2 stage 3; provisional design direction.
name: Diabolist
size: general
evolvesFrom: necromancer
description: >-
  An evolved Necromancer: tall tan occultist retaining the crooked charcoal hat, plum layered
  robes and high riblike bone collar. Hat gains a forked crown brim, robe gains angular split
  sleeves and a skull reliquary at chest. Near right fist holds black staff at waist, skull finial
  UP; far left hand remains free. Face RIGHT in every frame. Natural body, hair, feathers, stone
  and metal use the stated non-green palette; saturated green is reserved exclusively for team
  cloth. Team cloth: a wide front apron panel in readable pure flat green #00FF00; keep a broad
  unobstructed panel visible.
animationNotes: >-
  Idle: sleeve tips stir with breathing. Walk: follow the body-specific walkNotes. Attack: curl
  left hand toward reliquary and lean back; extend left palm RIGHT; flare a compact violet sigil
  no wider than torso; retract hand and settle. Hit: shoulders recoil behind raised left forearm.
  Death: knees lower, staff tilts close to body and robes collapse sideways; final frame remains
  still. All five animations: idle, walk, attack, hit, death. Use four distinct sequential attack
  poses: anticipation, extension, follow-through, recovery. Keep full body, weapons, wings, tail,
  cloth and effects inside each cell with generous uninterrupted magenta gutters on all four
  sides, including death; shrink pose reach if needed. Fixed scale and anchor, no camera movement
  or neighbouring-cell overlap.
walkNotes: >-
  Slow deliberate heel-to-toe steps beneath split robe, alternating boot contact and passing. Keep
  upper body stable and staff upright; heavy sleeves lag gently LEFT. Four-frame full sheets use
  contact/passing/opposite contact/passing or the four flight phases above; six-frame movement
  strips add intermediate weight-transfer or wing-transition poses. Every adjacent frame advances
  the cycle. Stay in place facing RIGHT; near limbs lighter and far limbs darker, without swapping
  identities. Preserve grip and limb count; leave magenta clearance around the entire moving
  silhouette.
