# MVP2 stage 1; provisional design direction.
name: Cherub
size: stage1
description: >-
  A small ivory angelic cherub with rounded cheeks, curled gold hair, a small gold halo and two
  short feathered ivory wings. Stocky childlike proportions in a cream tunic, bare feet tucked
  beneath while flying. Empty hands. Face RIGHT in every frame. Natural body, hair, feathers,
  stone and metal use the stated non-green palette; saturated green is reserved exclusively for
  team cloth. Team cloth: a broad short waist sash in readable pure flat green #00FF00; keep a
  broad unobstructed panel visible.
animationNotes: >-
  Idle: small feather flutter and breathing. Walk: follow the body-specific walkNotes. Attack:
  draw open hands to chest and tuck wings; extend both palms RIGHT with a tiny gold pulse; draw
  elbows back; resume hover. Hit: flinch back with wings curled forward. Death: halo tilts, wings
  fold and figure gently lands curled on its side; final frame remains still. All five animations:
  idle, walk, attack, hit, death. Use four distinct sequential attack poses: anticipation,
  extension, follow-through, recovery. Keep full body, weapons, wings, tail, cloth and effects
  inside each cell with generous uninterrupted magenta gutters on all four sides, including death;
  shrink pose reach if needed. Fixed scale and anchor, no camera movement or neighbouring-cell
  overlap.
walkNotes: >-
  Two-wing hovering: wings fully raised, halfway down, fully lowered, halfway up. Bare feet stay
  tucked and never march; shallow vertical bob. Four-frame full sheets use
  contact/passing/opposite contact/passing or the four flight phases above; six-frame movement
  strips add intermediate weight-transfer or wing-transition poses. Every adjacent frame advances
  the cycle. Stay in place facing RIGHT; near limbs lighter and far limbs darker, without swapping
  identities. Preserve grip and limb count; leave magenta clearance around the entire moving
  silhouette.
