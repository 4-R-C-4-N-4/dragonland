# MVP2 stage 3; provisional design direction.
name: Devil
size: general
evolvesFrom: demon
description: >-
  An evolved Demon: towering crimson devil retaining swept horns, pointed ears, digitigrade
  hooves, bat wings and curled spade tail. Crownlike branching horn ridges, angular black shoulder
  plates and a heavier chest give a commanding silhouette. Unarmed clawed hands remain separate.
  Face RIGHT in every frame. Natural body, hair, feathers, stone and metal use the stated
  non-green palette; saturated green is reserved exclusively for team cloth. Team cloth: a wide
  split waist banner in readable pure flat green #00FF00; keep a broad unobstructed panel visible.
animationNotes: >-
  Idle: slow chest rise and horned head tilt. Walk: follow the body-specific walkNotes. Attack:
  compress at the hocks with near claw cocked; extend a heavy claw sweep RIGHT; finish with talons
  below shoulder height; pull back into guard. Hit: wings tighten as shoulders recoil. Death:
  hocks give way, torso sinks then rolls sideways with wings folded; final frame remains still.
  All five animations: idle, walk, attack, hit, death. Use four distinct sequential attack poses:
  anticipation, extension, follow-through, recovery. Keep full body, weapons, wings, tail, cloth
  and effects inside each cell with generous uninterrupted magenta gutters on all four sides,
  including death; shrink pose reach if needed. Fixed scale and anchor, no camera movement or
  neighbouring-cell overlap.
walkNotes: >-
  Heavy hoofed stalk with alternating low forward hoof placement and bent-hock weight transfer.
  Fold wings high enough to show both legs; no generic marching. Four-frame full sheets use
  contact/passing/opposite contact/passing or the four flight phases above; six-frame movement
  strips add intermediate weight-transfer or wing-transition poses. Every adjacent frame advances
  the cycle. Stay in place facing RIGHT; near limbs lighter and far limbs darker, without swapping
  identities. Preserve grip and limb count; leave magenta clearance around the entire moving
  silhouette.
