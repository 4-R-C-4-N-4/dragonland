# MVP2 stage 1; provisional design direction.
name: Witch
size: stage1
description: >-
  A wiry human witch in a tall bent charcoal hat, plum dress, brown boots and a ragged black
  shoulder shawl. Warm tan face, hooked hat profile and a visible narrow waist. Near right hand
  grips a short ash wand at its base, tip diagonally UP and RIGHT; left hand cups an empty spell
  gesture. Face RIGHT in every frame. Natural body, hair, feathers, stone and metal use the stated
  non-green palette; saturated green is reserved exclusively for team cloth. Team cloth: a broad
  waist apron in readable pure flat green #00FF00; keep a broad unobstructed panel visible.
animationNotes: >-
  Idle: hat brim and shoulders rise with breathing. Walk: follow the body-specific walkNotes.
  Attack: draw wand tip back above shoulder; extend right fist and wand RIGHT; release a small
  violet spark; retract to raised guard. Hit: fold left arm inward and flinch back. Death: knees
  buckle, hat tips and figure collapses sideways; final frame remains still. All five animations:
  idle, walk, attack, hit, death. Use four distinct sequential attack poses: anticipation,
  extension, follow-through, recovery. Keep full body, weapons, wings, tail, cloth and effects
  inside each cell with generous uninterrupted magenta gutters on all four sides, including death;
  shrink pose reach if needed. Fixed scale and anchor, no camera movement or neighbouring-cell
  overlap.
walkNotes: >-
  Cautious bent-knee steps, near boot reaches then far boot passes low before opposite contact;
  skirt parts enough to show both feet, wand held steady rather than swung. Four-frame full sheets
  use contact/passing/opposite contact/passing or the four flight phases above; six-frame movement
  strips add intermediate weight-transfer or wing-transition poses. Every adjacent frame advances
  the cycle. Stay in place facing RIGHT; near limbs lighter and far limbs darker, without swapping
  identities. Preserve grip and limb count; leave magenta clearance around the entire moving
  silhouette.
