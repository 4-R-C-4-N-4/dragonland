# MVP2 stage 3; provisional design direction.
name: Kyilkhor
size: general
evolvesFrom: elemental
description: >-
  An evolved Elemental: geometric warm grey stone guardian retaining inset amber eyes, floating
  joint gaps, two huge fists and two block feet. Concentric square shoulder frames and a faceted
  circular core form a compact mandala-like torso, with stepped crown and angular hip plates. No
  green light or living foliage. Face RIGHT in every frame. Natural body, hair, feathers, stone
  and metal use the stated non-green palette; saturated green is reserved exclusively for team
  cloth. Team cloth: a broad rectangular waist banner in readable pure flat green #00FF00; keep a
  broad unobstructed panel visible.
animationNotes: >-
  Idle: concentric core turns a small fraction then returns. Walk: follow the body-specific
  walkNotes. Attack: compress square shoulder frames and draw near fist back; extend fist RIGHT
  along a straight axis; stop with joint gaps still connected visually; retract into symmetric
  guard. Hit: frames tilt backward together around core. Death: core dims, rings nest and limbs
  fold into a still low geometric stack; final frame remains still. All five animations: idle,
  walk, attack, hit, death. Use four distinct sequential attack poses: anticipation, extension,
  follow-through, recovery. Keep full body, weapons, wings, tail, cloth and effects inside each
  cell with generous uninterrupted magenta gutters on all four sides, including death; shrink pose
  reach if needed. Fixed scale and anchor, no camera movement or neighbouring-cell overlap.
walkNotes: >-
  Measured geometric locomotion: near block foot translates forward then plants, torso shifts over
  it, far foot advances then plants, torso recentres. Small joint rotations, no marching knees or
  free-spinning detached parts. Four-frame full sheets use contact/passing/opposite
  contact/passing or the four flight phases above; six-frame movement strips add intermediate
  weight-transfer or wing-transition poses. Every adjacent frame advances the cycle. Stay in place
  facing RIGHT; near limbs lighter and far limbs darker, without swapping identities. Preserve
  grip and limb count; leave magenta clearance around the entire moving silhouette.
