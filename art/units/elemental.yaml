# MVP2 stage 2; provisional design direction.
name: Elemental
size: stage2
evolvesFrom: golem
description: >-
  An evolved Golem: warm grey stone elemental retaining inset amber eyes, massive fists and block
  feet. Shoulder stones float across narrow amber-lit gaps, torso narrows around a suspended core
  and layered basalt plates form a jagged crown. Two arms and two legs remain distinct. Face RIGHT
  in every frame. Natural body, hair, feathers, stone and metal use the stated non-green palette;
  saturated green is reserved exclusively for team cloth. Team cloth: a broad strapped waist panel
  in readable pure flat green #00FF00; keep a broad unobstructed panel visible.
animationNotes: >-
  Idle: core pulses amber as shoulder blocks rise and settle. Walk: follow the body-specific
  walkNotes. Attack: draw near fist beside core as shoulder stones compress; extend fist RIGHT
  with joint gaps opening slightly; arrest the punch; retract stones to resting spacing. Hit:
  torso stones compress backward without scattering. Death: core dims, limbs fold and stones
  settle into a still compact pile; final frame remains still. All five animations: idle, walk,
  attack, hit, death. Use four distinct sequential attack poses: anticipation, extension,
  follow-through, recovery. Keep full body, weapons, wings, tail, cloth and effects inside each
  cell with generous uninterrupted magenta gutters on all four sides, including death; shrink pose
  reach if needed. Fixed scale and anchor, no camera movement or neighbouring-cell overlap.
walkNotes: >-
  Floating-joint stone stride: alternate low block-foot placement while shoulder stones lag the
  weight shift. No human knee pumping; maintain fixed stone count and small joint gaps. Four-frame
  full sheets use contact/passing/opposite contact/passing or the four flight phases above;
  six-frame movement strips add intermediate weight-transfer or wing-transition poses. Every
  adjacent frame advances the cycle. Stay in place facing RIGHT; near limbs lighter and far limbs
  darker, without swapping identities. Preserve grip and limb count; leave magenta clearance
  around the entire moving silhouette.
