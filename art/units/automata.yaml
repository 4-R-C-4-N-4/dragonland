# MVP2 stage 1; provisional design direction.
name: Automata
size: stage1
description: >-
  A small articulated brass automaton with a round riveted head, dark glass eyes, barrel chest,
  exposed elbow pins, pincer hands and two broad hinged feet. Brass, dark steel and cream enamel
  only; no green status lights. Empty pincers. Face RIGHT in every frame. Natural body, hair,
  feathers, stone and metal use the stated non-green palette; saturated green is reserved
  exclusively for team cloth. Team cloth: a broad chest cloth bib in readable pure flat green
  #00FF00; keep a broad unobstructed panel visible.
animationNotes: >-
  Idle: small head tilt and chest gear tick. Walk: follow the body-specific walkNotes. Attack:
  ratchet near pincer back beside chest; extend near arm RIGHT with jaws open; close jaws; retract
  to neutral. Hit: torso jerks back around waist hinge. Death: power fades, knees hinge and body
  folds onto its side; final frame remains still. All five animations: idle, walk, attack, hit,
  death. Use four distinct sequential attack poses: anticipation, extension, follow-through,
  recovery. Keep full body, weapons, wings, tail, cloth and effects inside each cell with generous
  uninterrupted magenta gutters on all four sides, including death; shrink pose reach if needed.
  Fixed scale and anchor, no camera movement or neighbouring-cell overlap.
walkNotes: >-
  Clockwork gait: near foot pivots forward and plants flat, far knee hinge folds and passes low,
  far foot plants, near hinge passes. Clear mechanical stops, no organic bouncing. Four-frame full
  sheets use contact/passing/opposite contact/passing or the four flight phases above; six-frame
  movement strips add intermediate weight-transfer or wing-transition poses. Every adjacent frame
  advances the cycle. Stay in place facing RIGHT; near limbs lighter and far limbs darker, without
  swapping identities. Preserve grip and limb count; leave magenta clearance around the entire
  moving silhouette.
