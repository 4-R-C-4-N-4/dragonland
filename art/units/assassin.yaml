# MVP2 stage 3; provisional design direction.
name: Assassin
size: general
evolvesFrom: rogue
description: >-
  An evolved Rogue: lean human assassin retaining Spy/Rogue forward crouch, half mask, charcoal
  asymmetrical hooded coat, wrapped boots and exactly two silver daggers. A pointed hood, split
  shoulder cape and layered thigh guards sharpen the silhouette without hiding knees. Near right
  fist holds dagger low in REVERSE grip: blade exits little-finger side DOWN and slightly LEFT
  away from thigh. Far left fist holds dagger at chest in FORWARD grip: blade exits thumb side
  horizontally RIGHT. Dark handles separate fists from blades. Face RIGHT in every frame. Natural
  body, hair, feathers, stone and metal use the stated non-green palette; saturated green is
  reserved exclusively for team cloth. Team cloth: a broad waist sash and short scarf in readable
  pure flat green #00FF00; keep a broad unobstructed panel visible.
animationNotes: >-
  Idle: restrained breathing with both knives steady. Walk: follow the body-specific walkNotes.
  Attack: sink slightly and coil far left elbow; extend far left blade RIGHT in a thrust while
  near reverse blade stays low; make a short near-hand downward outward cut as left retracts;
  recover original two-knife guard. Hit: fold elbows in and recoil while knees remain bent. Death:
  knees fold, body rolls sideways and both blades remain attached to their fists inside the cell;
  final frame remains still. All five animations: idle, walk, attack, hit, death. Use four
  distinct sequential attack poses: anticipation, extension, follow-through, recovery. Keep full
  body, weapons, wings, tail, cloth and effects inside each cell with generous uninterrupted
  magenta gutters on all four sides, including death; shrink pose reach if needed. Fixed scale and
  anchor, no camera movement or neighbouring-cell overlap.
walkNotes: >-
  Stealth glide overriding generic biped walk: near foot reaches toe-first, far foot passes just
  above floor, far foot reaches, near foot passes. Knees stay bent, hips level, head bob below one
  game pixel. Maintain right reverse and left forward grips without arm swing. Four-frame full
  sheets use contact/passing/opposite contact/passing or the four flight phases above; six-frame
  movement strips add intermediate weight-transfer or wing-transition poses. Every adjacent frame
  advances the cycle. Stay in place facing RIGHT; near limbs lighter and far limbs darker, without
  swapping identities. Preserve grip and limb count; leave magenta clearance around the entire
  moving silhouette.
