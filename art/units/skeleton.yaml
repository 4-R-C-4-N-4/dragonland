# MVP2 stage 2; provisional design direction.
name: Skeleton
size: stage2
evolvesFrom: zombie
description: >-
  An evolved Zombie: bare ivory skeleton retaining the forward hunch, slack jaw and ragged brown
  clothing remnants, now exposed ribs, angular pelvis and long bony fingers. Rusted shoulder
  straps preserve its prior uneven shoulder line. Empty hands reach RIGHT. Face RIGHT in every
  frame. Natural body, hair, feathers, stone and metal use the stated non-green palette; saturated
  green is reserved exclusively for team cloth. Team cloth: a broad torn waist cloth in readable
  pure flat green #00FF00; keep a broad unobstructed panel visible.
animationNotes: >-
  Idle: jaw chatters once and ribcage rocks. Walk: follow the body-specific walkNotes. Attack:
  pull near bony hand toward ribs; extend it RIGHT in a hooked rake; curl fingers past contact;
  retract into hunched guard. Hit: ribcage jerks back with elbows folding. Death: knees buckle and
  articulated bones settle in a compact still heap; final frame remains still. All five
  animations: idle, walk, attack, hit, death. Use four distinct sequential attack poses:
  anticipation, extension, follow-through, recovery. Keep full body, weapons, wings, tail, cloth
  and effects inside each cell with generous uninterrupted magenta gutters on all four sides,
  including death; shrink pose reach if needed. Fixed scale and anchor, no camera movement or
  neighbouring-cell overlap.
walkNotes: >-
  Loose jointed shuffle with alternating low foot drags and visible knee hinges; ribcage rocks
  over hips, toes scrape rather than high stepping. Maintain exactly two arms and two legs.
  Four-frame full sheets use contact/passing/opposite contact/passing or the four flight phases
  above; six-frame movement strips add intermediate weight-transfer or wing-transition poses.
  Every adjacent frame advances the cycle. Stay in place facing RIGHT; near limbs lighter and far
  limbs darker, without swapping identities. Preserve grip and limb count; leave magenta clearance
  around the entire moving silhouette.
